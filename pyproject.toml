[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/test_apr",
]


[project]
name = "test-apr"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "click>=8.5.0",
    "elasticsearch[async]>=9.5.1,<10",
    "fastapi>=0.142.4",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.4",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]


[tool.isort]
multi_line_output = 5
force_single_line = false
combine_as_imports = true


[tool.ruff.lint]
select = ["E", "F", "W", "C90"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"models.py" = ["E501"]
