[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/test_apr",
]


[project]
name = "test-apr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "click>=8.4.2",
    "elasticsearch[async]>=7.17.13",
    "fastapi>=0.139.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "typer>=0.26.8",
    "uvicorn>=0.50.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
